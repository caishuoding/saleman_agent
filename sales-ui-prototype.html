      const name=input.value.trim();
      input.setCustomValidity(name?'':'请输入练习名称');
      if(!input.reportValidity()) return;
      const savedId=renamingId;
      for(const rec of state.history) if(rec.id===renamingId) rec.name=name;
      renamingId=null;
      render();
      remember();
      element.querySelector('[data-action="rename"][data-id="'+savedId+'"]')?.focus();
    }
    // 绘制状态、练习类型与产品项目选择器，三个条件可组合筛选。
    function recordFilters(filters) {
      let options='<option value="all" '+(filters.type==='all'?'selected':'')+'>全部类型</option>';
      for(let index=0;index<types.length;index++) options+='<option value="'+index+'" '+(filters.type===String(index)?'selected':'')+'>'+types[index]+'</option>';
      let projects='<option value="all" '+(filters.project==='all'?'selected':'')+'>全部项目</option>';
      for(const product of products) projects+='<option value="'+product.id+'" '+(filters.project===product.id?'selected':'')+'>'+product.name+'</option>';
      return '<div class="record-filters"><label class="filter-label">状态<select class="filter-select" data-filter="status"><option value="all" '+(filters.status==='all'?'selected':'')+'>全部状态</option><option value="done" '+(filters.status==='done'?'selected':'')+'>已完成</option><option value="ongoing" '+(filters.status==='ongoing'?'selected':'')+'>未完成</option></select></label><label class="filter-label">练习类型<select class="filter-select" data-filter="type">'+options+'</select></label><label class="filter-label">项目<select class="filter-select" data-filter="project">'+projects+'</select></label></div>';
    }
    // 历史与收藏分别按状态、类型与产品项目筛选，匹配记录保留原操作。
    function history(favoritesOnly=false) {
      const filters=state.filters[favoritesOnly?'favorites':'history'];
      let total=0;
      let rows='';
      for(const rec of state.history) {
        if(favoritesOnly&&!rec.favorite) continue;
        total++;
        if(filters.status!=='all'&&rec.status!==filters.status) continue;
        if(filters.type!=='all'&&String(rec.type)!==filters.type) continue;
        if(filters.project!=='all'&&rec.product!==filters.project) continue;
        const p=getProduct(rec.product);
        const editing=renamingId===rec.id;
        const title=editing?renameEditor(rec):'<h3>'+escapeText(exerciseName(rec))+'</h3>';
        const metadata=rec.name?'<p class="small muted">'+p.name+' · '+types[rec.type]+'</p>':'';
        const favoriteAction=favoritesOnly?button('删除','delete-favorite','danger','data-id="'+rec.id+'" aria-label="删除收藏'+escapeAttribute(exerciseName(rec))+'"'):favoriteButton(rec);
        rows+='<article class="record"><div class="record-info">'+title+metadata+'<p class="small muted">开始时间 '+formatStartTime(rec)+'</p></div><div class="actions"><span class="status '+(rec.status==='ongoing'?'ongoing':'')+'">'+(rec.status==='ongoing'?'未完成':'已完成')+'</span>'+(!editing?button('重命名','rename','quiet','data-id="'+rec.id+'"'):'')+favoriteAction+button(rec.status==='ongoing'?'继续练习':'查看复盘',rec.status==='ongoing'?'resume':'open-review','','data-id="'+rec.id+'"')+'</div></article>';
      }
      if(!rows) rows=total?'<div class="empty">没有符合条件的练习</div>':'<div class="empty"><p>'+(favoritesOnly?'还没有收藏的练习':'还没有练习记录')+'</p>'+button(favoritesOnly?'查看历史记录':'前往练习',favoritesOnly?'history':'home','quiet')+'</div>';
      return '<div class="page"><h1>'+(favoritesOnly?'收藏':'历史记录')+'</h1>'+recordFilters(filters)+'<div aria-live="polite">'+rows+'</div></div>';
    }
    // 更新所在列表的筛选条件，保留另一列表的选择并恢复控件焦点。
    function onFilterChange(event) {
      const control=event.target.closest('select[data-filter]');
      if(!control||!['history','favorites'].includes(state.page)) return;
      const field=control.dataset.filter;
      state.filters[state.page][field]=control.value;
      renamingId=null;
      render();
      remember();
      element.querySelector('[data-filter="'+field+'"]')?.focus();
    }
    // 删除前明确提示操作仅移出收藏，原历史记录可继续访问。
    function favoriteDeleteDialog() {
      return '<div class="dialog-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="'+layout+'-delete-title"><h2 id="'+layout+'-delete-title">删除这条收藏？</h2><p>这次练习将从收藏列表移除，历史记录仍会保留。</p><div class="actions">'+button('取消','cancel-delete-favorite')+button('删除收藏','confirm-delete-favorite','danger')+'</div></section></div>';
    }
    // 复盘同步显示练习名称，保留三栏布局及总结与教练回复的占位内容。
    function review() {
      const rec=currentRecord();
      if(!rec) return home();
      const p=selectedProduct();
      return '<div class="chat-toolbar"><div><h2>'+escapeText(exerciseName(rec))+'</h2><p class="small muted">'+types[rec.type]+' · '+p.name+' · '+p.person+'</p><p class="small muted">开始时间 '+formatStartTime(rec)+'</p></div><div class="actions">'+favoriteButton(rec)+button('重新练习','retry','primary')+'</div></div><div class="review-layout"><section class="review-transcript" aria-label="原始聊天记录"><header class="review-heading"><h3>原始聊天记录</h3></header><div class="messages">'+messages(rec.messages)+'</div></section><section class="review-summary" aria-label="复盘总结"><header class="review-heading"><h3>复盘总结</h3></header><div class="report"><p class="small muted">总结内容待设计</p><div class="summary-placeholder" aria-hidden="true"><span class="placeholder-line"></span><span class="placeholder-line"></span><span class="placeholder-line"></span><span class="placeholder-line"></span><span class="placeholder-line"></span><span class="placeholder-line"></span></div></div></section>'+coachPanel(true)+'</div>';
    }
    // 渲染页面和删除收藏提示，并将确认操作的焦点放在弹窗中。
    function render() {
      const inLibrary=state.page==='library'||state.page==='product'&&state.returnPage==='library';
      const training=['choose','prepare','practice','review'].includes(state.page);
      const title=state.page==='home'?'训练首页':state.page==='history'?'历史记录':state.page==='favorites'?'收藏':inLibrary?'项目资料':state.page==='product'?'产品资料':types[state.selected];
      let content;
      switch(state.page) {
        case 'home':content=home();break;
        case 'library':content=library();break;
        case 'choose':content=choose();break;
        case 'prepare':content=prepare();break;
        case 'practice':content=practice();break;
        case 'history':content=history();break;
        case 'favorites':content=history(true);break;
        case 'product':content=productPage();break;
        default:content=review();
      }
      element.innerHTML='<aside class="rail"><div class="brand"><span class="brand-mark">'+icon('audio-lines')+'</span>销售陪练</div><nav aria-label="主导航"><button class="nav-item" data-action="home" '+(!inLibrary&&!['history','favorites'].includes(state.page)?'aria-current="page"':'')+'>'+icon('layout-grid')+'训练首页</button><button class="nav-item" data-action="library" '+(inLibrary?'aria-current="page"':'')+'>'+icon('folder-open')+'项目资料</button><button class="nav-item" data-action="history" '+(state.page==='history'?'aria-current="page"':'')+'>'+icon('clock-3')+'历史记录</button><button class="nav-item" data-action="favorites" '+(state.page==='favorites'?'aria-current="page"':'')+'>'+icon('star')+'收藏</button></nav><div class="rail-bottom">文字陪练</div></aside><main class="work"><header class="top"><div><div class="crumb">'+(training?'销售训练 / '+types[state.selected]:'销售训练')+'</div><div class="top-title">'+title+'</div></div>'+(state.page==='practice'?button('退出练习','home','quiet'):'')+'</header>'+content+'</main>'+(state.confirm?'<div class="dialog-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="'+layout+'-confirm-title"><h2 id="'+layout+'-confirm-title">结束本次练习？</h2><p>确认后将结束本次甲方沟通并进入复盘。对话记录会保留，重练将恢复同一产品和甲方的初始情境。</p><div class="actions">'+button('继续沟通','cancel')+button('结束并复盘','confirm','primary')+'</div></section></div>':'');
      if(deletingFavoriteId!==null) element.insertAdjacentHTML('beforeend',favoriteDeleteDialog());
      if(globalThis.lucide) lucide.createIcons({attrs:{width:17,height:17}});
      if(deletingFavoriteId!==null) element.querySelector('[data-action="cancel-delete-favorite"]').focus();
      else if(state.confirm) element.querySelector('[data-action="cancel"]').focus();
      else if(previousFocus) {
        element.querySelector('[data-action="'+previousFocus+'"]')?.focus();
        previousFocus=null;
      }
    }
    // 创建独立练习，开始时间在点击开始时记录，重练默认未收藏。
    function startPractice() {
      const p=selectedProduct();
      let maxId=0;
      for(const rec of state.history) maxId=Math.max(maxId,rec.id);
      state.current=maxId+1;
      state.history.unshift({id:state.current,product:p.id,type:state.selected,status:'ongoing',startedAt:new Date().toISOString(),favorite:false,messages:[{who:'customer',text:opening(p,state.selected)}],coach:[],followups:[]});
      state.coach=false;
      state.materials=false;
      state.page='practice';
    }
    // 处理重命名及收藏删除确认，移出收藏时保留原练习与对话。
    function onAction(event) {
      const target=event.target.closest('[data-action]'); if(!target||!element.contains(target)) return;
      const action=target.dataset.action;
      let restoreDeleteFocusId=null;
      if(action==='send') { onSubmit(event); return; }
      if(action==='save-rename') { saveRename(); return; }
      if(action==='rename') renamingId=Number(target.dataset.id);
      if(action==='cancel-rename') renamingId=null;
      if(action==='delete-favorite') { deletingFavoriteId=Number(target.dataset.id); renamingId=null; }
      if(action==='cancel-delete-favorite') { restoreDeleteFocusId=deletingFavoriteId; deletingFavoriteId=null; }
      if(action==='confirm-delete-favorite') {
        for(const rec of state.history) if(rec.id===deletingFavoriteId) rec.favorite=false;
        deletingFavoriteId=null;
      }
      if(action==='favorite') {
        for(const rec of state.history) if(rec.id===Number(target.dataset.id)) rec.favorite=!rec.favorite;
      }
      if(['home','history','favorites','library'].includes(action)) { state.page=action; state.confirm=false; renamingId=null; deletingFavoriteId=null; }
      if(action==='product') { state.viewedProduct=getProduct(target.dataset.product).id; state.returnPage=state.page; state.page='product'; }
      if(action==='back-product') state.page=state.returnPage||'library';
      if(action==='select') { state.selected=Number(target.dataset.type); state.page='choose'; }
      if(action==='choose-product') { state.product=getProduct(target.dataset.product).id; state.page='prepare'; }
      if(action==='change-product') state.page='choose';
      if(action==='start') startPractice();
      if(action==='resume'||action==='open-review') { state.current=Number(target.dataset.id); const rec=currentRecord(); state.selected=rec.type; state.product=rec.product; state.page=action==='resume'?'practice':'review'; state.transcript=false; state.coach=false; }
      if(action==='coach') state.coach=!state.coach;
      if(action==='materials') state.materials=!state.materials;
      if(action==='finish') state.confirm=true;
      if(action==='cancel') { state.confirm=false; previousFocus='finish'; }
      if(action==='confirm') { currentRecord().status='done'; state.page='review'; state.confirm=false; state.transcript=false; }
      if(action==='retry') { const rec=currentRecord(); state.selected=rec.type; state.product=rec.product; state.page='prepare'; }
      render(); remember();
      if(restoreDeleteFocusId!==null) element.querySelector('[data-action="delete-favorite"][data-id="'+restoreDeleteFocusId+'"]')?.focus();
      if(action==='rename') {
        const input=element.querySelector('[data-rename-input]');
        input?.focus();
        input?.select();
      }
    }
    // 保存提问并展示演示回复，复盘教练只反馈占位文案。
    function onSubmit(event) { const form=event.target.closest('form[data-target]'); if(!form) return; event.preventDefault(); const input=form.querySelector('textarea'); const text=input.value.trim(); if(!text) { input.focus(); return; } const rec=currentRecord(); const p=selectedProduct(); const target=form.dataset.target; const list=target==='customer'?rec.messages:target==='coach'?rec.coach:rec.followups; list.push({who:'user',text}); const replies=target==='customer'?['我们目前'+p.problem+'。',p.example,p.concern]:target==='coach'?['可以请'+p.person+'讲一个具体例子，再确认问题对业务的影响。也可以从她负责的工作和这次项目目标开始了解。']:['已收到你的问题，教练回复将在这里展示。']; list.push({who:target==='customer'?'customer':'coach',text:replies[Math.max(0,Math.min(Math.floor(list.length/2)-1,replies.length-1))]}); render(); remember(); element.querySelector('form[data-target="'+target+'"] textarea')?.focus(); }
    // 支持名称编辑快捷键，并管理结束练习与删除收藏弹窗的焦点。
    function onKeydown(event) {
      if(event.target.matches('[data-rename-input]')) {
        if(event.isComposing) return;
        if(event.key==='Enter') { event.preventDefault(); saveRename(); return; }
        if(event.key==='Escape') {
          const cancelledId=renamingId;
          renamingId=null;
          render();
          element.querySelector('[data-action="rename"][data-id="'+cancelledId+'"]')?.focus();
          return;
        }
      }
      if(deletingFavoriteId!==null&&event.key==='Escape') {
        const cancelledId=deletingFavoriteId;
        deletingFavoriteId=null;
        render();
        element.querySelector('[data-action="delete-favorite"][data-id="'+cancelledId+'"]')?.focus();
        return;
      }
      if(!state.confirm&&deletingFavoriteId===null) return;
      if(event.key==='Escape') { state.confirm=false; previousFocus='finish'; render(); return; }
      if(event.key==='Tab') {
        const buttons=element.querySelectorAll('.dialog button');
        const first=buttons[0];
        const last=buttons[buttons.length-1];
        if(event.shiftKey&&document.activeElement===first) { event.preventDefault(); last.focus(); }
        else if(!event.shiftKey&&document.activeElement===last) { event.preventDefault(); first.focus(); }
      }
    }
    // 接受宿主较新的兼容状态，避免过时回传覆盖刚发生的交互。
    function onGlobals(event) { const next=event.detail?.globals?.widgetState?.privateContent?.[layout]; if(next&&(next.revision||0)>(state.revision||0)&&Array.isArray(next.history)) { state={...state,...next}; normalizeState(); render(); } }
    element.addEventListener('click',onAction); element.addEventListener('submit',onSubmit); element.addEventListener('keydown',onKeydown); element.addEventListener('change',onFilterChange); window.addEventListener('openai:set_globals',onGlobals);
    render();
    const design={accent:'#245cbe'};
    // 允许在宿主中调整产品主色，保持当前交互状态。
    function updateDesign() { element.style.setProperty('--brand',design.accent); }
    if(globalThis.Tweak) { const tweak=new Tweak({container:element,onChange:updateDesign}); tweak.addColorPicker(design,'accent',{label:'主色',reference:'--brand'}); }
  }
  mountApp(root.querySelector('#sales-workbench'),'workbench');
  mountApp(root.querySelector('#sales-topnav'),'topnav');
})();
</script>
