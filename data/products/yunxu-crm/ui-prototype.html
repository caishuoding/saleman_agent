<style>
  #yunxu-crm {
    color-scheme: light dark;
    --yx-bg: light-dark(#f4f6fa, #111722);
    --yx-paper: light-dark(#fff, #1b2230);
    --yx-ink: light-dark(#253044, #e7edf8);
    --yx-sub: light-dark(#647087, #a6b3c8);
    --yx-line: light-dark(#e4e8ef, #344054);
    --yx-brand: light-dark(#6652bd, #b5a4ff);
    --yx-tint: light-dark(#eeebfa, #30284e);
    --yx-green: light-dark(#22765b, #7ad5b2);
    --yx-red: light-dark(#aa3744, #ff9fa8);
    font-family: "Geist", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--yx-ink);
    font-size: 13px;
    line-height: 1.6;
  }
  #yunxu-crm * {
    box-sizing: border-box;
  }
  #yunxu-crm [hidden] {
    display: none !important;
  }
  #yunxu-crm button,
  #yunxu-crm input,
  #yunxu-crm select,
  #yunxu-crm textarea {
    font: inherit;
  }
  #yunxu-crm button {
    cursor: pointer;
  }
  #yunxu-crm button:focus-visible,
  #yunxu-crm input:focus-visible,
  #yunxu-crm select:focus-visible,
  #yunxu-crm textarea:focus-visible {
    outline: 3px solid var(--yx-brand);
    outline-offset: 3px;
  }
  #yunxu-crm h1,
  #yunxu-crm h2,
  #yunxu-crm h3,
  #yunxu-crm p {
    margin: 0;
  }
  #yunxu-crm h1 {
    font-size: 23px;
    line-height: 1.3;
    font-weight: 650;
  }
  #yunxu-crm h2 {
    font-size: 16px;
    font-weight: 600;
  }
  #yunxu-crm h3 {
    font-size: 14px;
    font-weight: 600;
  }
  #yunxu-crm .yx-shell {
    display: grid;
    grid-template-columns: 153px minmax(0, 1fr);
    min-height: 748px;
    border: 1px solid var(--yx-line);
    border-radius: 14px;
    overflow: clip;
    background: var(--yx-bg);
    position: relative;
  }
  #yunxu-crm .yx-rail {
    background: var(--yx-paper);
    padding: 24px 12px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    border-right: 1px solid var(--yx-line);
  }
  #yunxu-crm .yx-logo {
    padding: 0 9px;
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
    font-size: 18px;
    font-weight: 650;
  }
  #yunxu-crm .yx-mark {
    width: 25px;
    height: 27px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    background: var(--yx-brand);
    color: light-dark(#fff, #221947);
  }
  #yunxu-crm nav {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #yunxu-crm .yx-nav {
    border: 0;
    border-radius: 7px;
    color: var(--yx-sub);
    background: transparent;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 13px;
    text-align: left;
  }
  #yunxu-crm .yx-nav[aria-current="page"] {
    color: var(--yx-brand);
    background: var(--yx-tint);
    font-weight: 600;
  }
  #yunxu-crm .yx-account {
    margin-top: auto;
    padding: 14px 7px 0;
    border-top: 1px solid var(--yx-line);
  }
  #yunxu-crm .yx-muted {
    color: var(--yx-sub);
  }
  #yunxu-crm .yx-small {
    font-size: 11px;
  }
  #yunxu-crm .yx-avatar {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: inline-grid;
    place-items: center;
    border-radius: 50%;
    color: var(--yx-brand);
    background: var(--yx-tint);
    font-size: 11px;
  }
  #yunxu-crm .yx-main {
    min-width: 0;
  }
  #yunxu-crm .yx-top {
    padding: 15px 108px 15px 25px;
    min-height: 63px;
    background: var(--yx-paper);
    border-bottom: 1px solid var(--yx-line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
  }
  #yunxu-crm .yx-top label {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 11px;
    color: var(--yx-sub);
  }
  #yunxu-crm .yx-role {
    max-width: 150px;
    border: 0;
    background: var(--yx-paper);
    color: var(--yx-ink);
    font-size: 12px;
  }
  #yunxu-crm .yx-page {
    padding: 26px 24px;
  }
  #yunxu-crm .yx-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  #yunxu-crm .yx-heading .yx-muted {
    margin-top: 5px;
  }
  #yunxu-crm .yx-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  #yunxu-crm .yx-button {
    padding: 8px 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--yx-line);
    border-radius: 7px;
    color: var(--yx-ink);
    background: var(--yx-paper);
    white-space: nowrap;
  }
  #yunxu-crm .yx-button.primary {
    color: light-dark(#fff, #221947);
    background: var(--yx-brand);
    border-color: var(--yx-brand);
  }
  #yunxu-crm .yx-button.quiet {
    border-color: transparent;
    background: transparent;
    color: var(--yx-sub);
  }
  #yunxu-crm .yx-button.danger {
    color: var(--yx-red);
  }
  #yunxu-crm .yx-filters {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 21px;
  }
  #yunxu-crm .yx-field,
  #yunxu-crm .yx-select {
    border: 1px solid var(--yx-line);
    background: var(--yx-paper);
    color: var(--yx-ink);
    border-radius: 7px;
    padding: 9px 11px;
    min-width: 0;
    max-width: 100%;
  }
  #yunxu-crm .yx-field {
    width: 100%;
  }
  #yunxu-crm .yx-filters label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #yunxu-crm .yx-board {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 11px;
  }
  #yunxu-crm .yx-column {
    min-width: 0;
    background: light-dark(#edf0f5, #202a3a);
    border-radius: 9px;
    padding: 12px 9px;
    min-height: 430px;
  }
  #yunxu-crm .yx-column-head {
    padding: 0 3px 13px;
    border-top: 3px solid var(--yx-brand);
    padding-top: 10px;
  }
  #yunxu-crm .yx-column-head.won {
    border-color: var(--yx-green);
  }
  #yunxu-crm .yx-column-head.lost {
    border-color: var(--yx-sub);
  }
  #yunxu-crm .yx-column-head h3 {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    font-size: 12px;
  }
  #yunxu-crm .yx-column-head p {
    margin-top: 5px;
    font-size: 11px;
    color: var(--yx-sub);
  }
  #yunxu-crm .yx-deal {
    text-align: left;
    width: 100%;
    border: 1px solid var(--yx-line);
    background: var(--yx-paper);
    color: var(--yx-ink);
    border-radius: 7px;
    padding: 13px 11px;
    margin: 0 0 10px;
  }
  #yunxu-crm .yx-deal:hover {
    border-color: var(--yx-brand);
  }
  #yunxu-crm .yx-deal strong {
    display: block;
    font-size: 12px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  #yunxu-crm .yx-deal .yx-value {
    display: block;
    font-size: 17px;
    margin: 13px 0;
    font-weight: 600;
  }
  #yunxu-crm .yx-deal-foot {
    border-top: 1px solid var(--yx-line);
    padding-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--yx-sub);
  }
  #yunxu-crm .yx-empty {
    padding: 25px 8px;
    text-align: center;
    color: var(--yx-sub);
  }
  #yunxu-crm .yx-table-wrap {
    overflow: auto;
    background: var(--yx-paper);
    border: 1px solid var(--yx-line);
    border-radius: 10px;
  }
  #yunxu-crm table {
    border-collapse: collapse;
    width: 100%;
    text-align: left;
    font-size: 12px;
  }
  #yunxu-crm th,
  #yunxu-crm td {
    padding: 14px 13px;
    border-bottom: 1px solid var(--yx-line);
    vertical-align: top;
  }
  #yunxu-crm th {
    background: light-dark(#f8f9fc, #252f40);
    font-size: 11px;
    color: var(--yx-sub);
    font-weight: 500;
    white-space: nowrap;
  }
  #yunxu-crm tr:last-child td {
    border-bottom: 0;
  }
  #yunxu-crm .yx-link {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--yx-brand);
    text-align: left;
    font: inherit;
  }
  #yunxu-crm .yx-tag {
    display: inline-block;
    color: var(--yx-brand);
    background: var(--yx-tint);
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 11px;
  }
  #yunxu-crm .yx-tag.done {
    color: var(--yx-green);
    background: light-dark(#e9f5ee, #173a32);
  }
  #yunxu-crm .yx-back {
    margin-bottom: 18px;
  }
  #yunxu-crm .yx-detail {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 255px;
    gap: 20px;
  }
  #yunxu-crm .yx-panel {
    border: 1px solid var(--yx-line);
    border-radius: 10px;
    background: var(--yx-paper);
    padding: 21px;
    min-width: 0;
  }

    margin-top: 18px;
  }
  #yunxu-crm .yx-facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 17px;
    margin: 0;
  }
  #yunxu-crm .yx-facts dt {
    color: var(--yx-sub);
    font-size: 11px;
  }
  #yunxu-crm .yx-facts dd {
    margin: 5px 0 0;
  }
  #yunxu-crm .yx-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 17px;
  }
  #yunxu-crm .yx-label {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 12px;
  }
  #yunxu-crm textarea {
    min-height: 82px;
    resize: vertical;
  }
  #yunxu-crm .yx-timeline {
    border-left: 1px solid var(--yx-line);
    margin: 20px 0 0 5px;
    padding-left: 18px;
  }
  #yunxu-crm .yx-event {
    position: relative;
    padding-bottom: 22px;
  }

    content: "";

    left: -23px;
    top: 7px;
    height: 8px;
    width: 8px;
    background: var(--yx-brand);
    border-radius: 50%;
  }
  #yunxu-crm .yx-event p {
    margin-top: 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 17px 0;
    border-bottom: 1px solid var(--yx-line);

    border-bottom: 0;

    gap: 11px;

    margin-top: 5px;
  }

    text-decoration: line-through;
    color: var(--yx-sub);
  }

    margin-top: 24px;
  }

    gap: 14px;
    align-items: center;
  }

    background: var(--yx-bg);
    border-radius: 4px;
  }
  #yunxu-crm .yx-bar {
    height: 100%;
    border-radius: 4px;
    background: var(--yx-brand);
  }
  #yunxu-crm .yx-report-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

    background: light-dark(#eaf5ef, #17342c);
    border-radius: 7px;

    position: absolute;
    inset: 0;
    z-index: 5;
    background: light-dark(#20273c55, #0009);

    justify-content: center;
    padding: 85px 20px 25px;
  }

    border-radius: 13px;
    padding: 25px;
    width: 480px;
    max-width: 100%;

  #yunxu-crm .yx-modal p {
    margin-top: 8px;

  #yunxu-crm .yx-modal .yx-actions {
    margin-top: 18px;
    justify-content: flex-end;
  }
  #yunxu-crm .yx-import {
    margin: 18px 0;
    padding: 15px;
    border: 1px dashed var(--yx-line);
    border-radius: 8px;
  }
  #yunxu-crm .yx-error {
    color: var(--yx-red);
    font-size: 12px;
  }

    }
    #yunxu-crm .yx-nav {
      padding: 8px 10px;
    }
    #yunxu-crm .yx-account {
      display: none;
    }
    #yunxu-crm .yx-top {
      padding: 13px 17px;
    }
    #yunxu-crm .yx-board {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    #yunxu-crm .yx-report-grid {
      grid-template-columns: 1fr;
    }
    #yunxu-crm .yx-facts {
      grid-template-columns: 1fr;
    }
    #yunxu-crm .yx-modal {
      padding: 20px;
    }
    #yunxu-crm th,
    #yunxu-crm td {
      padding: 12px;
    }
  }
  @media (pointer: coarse) {
    #yunxu-crm button {
      min-height: 44px;
    }
    #yunxu-crm input,
    #yunxu-crm select,
    #yunxu-crm textarea {
      font-size: 16px;
    }
  }
</style>

      }
      if (state.modal === "task") {
        title = "新建跟进任务";
        let options = "";
        for (const deal of records("deals"))
          options +=
            '<option value="' +
            deal.id +
            '" ' +
            (deal.id === state.selectedDeal ? "selected" : "") +
            ">" +
            esc(find("accounts", deal.account).name) +
            " · " +
            esc(deal.name) +
            "</option>";
        body =
          '<label class="yx-label">任务名称<input class="yx-field" name="task-title" required maxlength="100"></label><label class="yx-label">关联商机<select class="yx-select" name="task-deal">' +
          options +
          '</select></label><label class="yx-label">截止日期<input class="yx-field" name="task-due" type="date" required value="2026-11-16"></label>';
        action = button("创建任务", "save-task", "primary");
      }
      if (state.modal === "import") {
        title =
          state.importStep === 0
            ? "导入示例 CSV"
            : state.importStep === 1
              ? "确认字段映射"
              : "导入结果";
        if (state.importStep === 0) {
          body =
            '<div class="yx-import"><h3>客户线索示例.csv</h3><p class="yx-muted">3 行示例数据，包含联系人、公司和邮箱。</p></div><p class="yx-small yx-muted">使用内置示例展示导入流程。</p>';
          action = button("下一步", "import-next", "primary");
        }
        if (state.importStep === 1) {
          body =
            '<div class="yx-table-wrap"><table><thead><tr><th>文件字段</th><th>线索字段</th></tr></thead><tbody><tr><td>客户姓名</td><td>联系人</td></tr><tr><td>企业名称</td><td>公司</td></tr><tr><td>联系邮箱</td><td>联系方式</td></tr></tbody></table></div><p class="yx-small yx-muted">校验必填字段，当前示例按电子邮箱检查重复。</p>';
          action = button("校验并导入", "import-confirm", "primary");
        }
        if (state.importStep === 2) {
          body =
            "<h3>" +
            esc(state.importResult || "导入已完成") +
            '</h3><div class="yx-import"><p class="yx-error">第 4 行 · 联系方式为空</p><p class="yx-small yx-muted">该行未创建。补齐联系方式后，可重新导入。</p></div>';
          action = button("完成", "close-modal", "primary");
        }
      }
      return (
        '<div class="yx-overlay"><section class="yx-modal" role="dialog" aria-modal="true" aria-labelledby="yx-modal-title"><h2 id="yx-modal-title">' +
        title +
        '</h2><div class="yx-form">' +
        body +
        '</div><div class="yx-actions">' +
        (state.modal === "import" && state.importStep === 2
          ? ""
          : button("取消", "close-modal")) +
        action +
        "</div></section></div>"
      );
    }
    // 渲染当前业务模块，保留全局角色入口和明确的演示标识。
    function render() {
      const page = state.page;
      let content = "";
      switch (page) {
        case "leads":
          content = leadsPage();
          break;
        case "accounts":
          content = accountsPage();
          break;
        case "account":
          content = accountPage();
          break;
        case "deal":
          content = dealPage();
          break;
        case "tasks":
          content = tasksPage();
          break;
        case "reports":
          content = reportsPage();
          break;
        case "settings":
          content = settingsPage();
          break;
        default:
          content = dealsPage();
      }
      let nav = "";
      for (const item of navItems)
        nav +=
          '<button type="button" class="yx-nav" data-action="navigate" data-page="' +
          item[0] +
          '" ' +
          (page === item[0] ||
          (page === "deal" && item[0] === "deals") ||
          (page === "account" && item[0] === "accounts")
            ? 'aria-current="page"'
            : "") +
          ">" +
          icon(item[2]) +
          item[1] +
          "</button>";
      let roles = "";
      for (const key of ["admin", "manager", "member"])
        roles +=
          '<option value="' +
          key +
          '" ' +
          (state.role === key ? "selected" : "") +
          ">" +
          roleNames[key] +
          "</option>";
      root.innerHTML =
        '<div class="yx-shell"><aside class="yx-rail"><div class="yx-logo"><span class="yx-mark">' +
        icon("layers-2") +
        '</span>云序 CRM</div><nav aria-label="CRM 导航">' +
        nav +
        '</nav><div class="yx-account"><span class="yx-avatar">舟</span> 陈舟<p class="yx-small yx-muted" style="margin-top:7px">标准版 · 演示数据</p></div></aside><main class="yx-main"><header class="yx-top"><span class="yx-muted">云序软件演示企业</span><label>体验角色<select class="yx-role" id="yx-role">' +
        roles +
        '</select></label></header><div class="yx-page">' +
        content +
        "</div>" +
        (state.notice
          ? '<div class="yx-notice" role="status">' +
            esc(state.notice) +
            "</div>"
          : "") +
        "</main>" +
        (state.modal ? modalContent() : "") +
        "</div>";
      if (globalThis.lucide)
        lucide.createIcons({ attrs: { width: 17, height: 17 } });
      if (state.modal)
        root
          .querySelector(
            '.yx-modal input,.yx-modal [data-action="close-modal"]',
          )
          ?.focus();
    }
    // 获取表单输入并执行原生必填校验。
    function field(name) {
      const control = root.querySelector('[name="' + name + '"]');
      if (!control || !control.reportValidity()) return null;
      const value = control.value.trim();
      if (!value) {
        control.setCustomValidity("请填写此项");
        control.reportValidity();
        return null;
      }
      control.setCustomValidity("");
      return value;
    }
    // 生成集合中的下一个稳定标识。
    function nextId(collection) {
      let id = 0;
      for (const item of state[collection]) id = Math.max(id, item.id);
      return id + 1;
    }
    // 处理业务操作，所有关联视图共同读取同一条演示记录。
    function onClick(event) {
      const trigger = event.target.closest("[data-action]");
      if (!trigger || !root.contains(trigger)) return;
      const action = trigger.dataset.action;
      state.notice = "";
      if (action === "navigate") state.page = trigger.dataset.page;
      if (action === "open-deal") {
        state.selectedDeal = Number(trigger.dataset.id);
        state.page = "deal";
      }
      if (action === "open-account") {
        state.selectedAccount = Number(trigger.dataset.id);
        state.page = "account";
      }
      if (action === "back-deals") state.page = "deals";
      if (action === "back-accounts") state.page = "accounts";
      if (["new-lead", "new-task", "import-leads"].includes(action)) {
        focusBeforeModal = { action, id: trigger.dataset.id };
        state.modal =
          action === "new-lead"
            ? "lead"
            : action === "new-task"
              ? "task"
              : "import";
        state.importStep = 0;
      }
      if (action === "close-modal") state.modal = null;
      if (action === "stage-report") {
        state.stageFilter = trigger.dataset.id;
        state.page = "deals";
      }
      if (action === "save-note") {
        const input = root.querySelector("#yx-note");
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        state.notes.push({
          id: nextId("notes"),
          deal: state.selectedDeal,
          author: "陈舟",
          date: new Intl.DateTimeFormat("sv-SE", {
            timeZone: "Asia/Shanghai",
            dateStyle: "short",
            timeStyle: "short",
          }).format(new Date()),
          text,
        });
        state.notice = "跟进记录已保存";
      }
      if (action === "save-deal") {
        const deal = currentDeal();
        if (!deal) return;
        const amount = root.querySelector("#yx-amount");
        const close = root.querySelector("#yx-close");
        const stage = Number(root.querySelector("#yx-stage").value);
        const reason = root.querySelector("#yx-loss");
        reason.required = stage === 4;
        reason.setCustomValidity(
          stage === 4 && !reason.value.trim() ? "请填写流失原因" : "",
        );
        if (
          !amount.reportValidity() ||
          !close.reportValidity() ||
          !reason.reportValidity()
        )
          return;
        deal.amount = Number(amount.value);
        deal.closeDate = close.value;
        deal.stage = stage;
        deal.reason = stage === 4 ? reason.value.trim() : "";
        state.notice = "商机信息已保存，报表同步更新";
      }
      if (action === "save-lead") {
        const name = field("lead-name");
        const company = field("lead-company");
        const contact = field("lead-contact");
        if (!name || !company || !contact) return;
        state.leads.push({
          id: nextId("leads"),
          name,
          company,
          contact,
          source: "手工录入",
          status: "待联系",
          owner: "陈舟",
          team: "一组",
        });
        state.modal = null;
        state.leadFilter = "all";
        state.notice = "线索已创建";
      }
      if (action === "save-task") {
        const title = field("task-title");
        const due = field("task-due");
        if (!title || !due) return;
        const dealId = Number(root.querySelector('[name="task-deal"]').value);
        const deal = find("deals", dealId);
        if (!deal || !visible(deal)) return;
        state.tasks.push({
          id: nextId("tasks"),
          deal: dealId,
          title,
          due,
          done: false,
        });
        state.modal = null;
        state.notice = "跟进任务已创建";
      }
      if (action === "convert-lead") {
        const lead = find("leads", trigger.dataset.id);
        if (!lead || !visible(lead) || lead.status === "已转化") return;
        const accountId = nextId("accounts");
        const dealId = nextId("deals");
        state.accounts.push({
          id: accountId,
          name: lead.company,
          industry: "待确认",
          owner: lead.owner,
          team: lead.team,
          contact: lead.name,
          title: "待确认",
          email: lead.contact.includes("@") ? lead.contact : "",
          phone: lead.contact.includes("@") ? "" : lead.contact,
        });
        state.deals.push({
          id: dealId,
          account: accountId,
          name: lead.company + " CRM 需求沟通",
          amount: 15480,
          stage: 0,
          owner: lead.owner,
          team: lead.team,
          closeDate: "2026-12-15",
          seats: 10,
          reason: "",
        });
        lead.status = "已转化";
        state.notice = "已建立企业客户、联系人和商机，可在对应模块查看";
      }
      if (action === "import-next") state.importStep = 1;
      if (action === "import-confirm") {
        let added = 0;
        for (const sample of [
          { name: "季然", company: "知行咨询", contact: "jiran@example.com" },
          { name: "叶澄", company: "佑禾设备", contact: "yecheng@example.com" },
        ]) {
          let duplicate = false;
          for (const lead of state.leads)
            if (lead.contact === sample.contact) duplicate = true;
          if (!duplicate) {
            state.leads.push({
              id: nextId("leads"),
              ...sample,
              source: "表格导入",
              status: "待联系",
              owner: "陈舟",
              team: "一组",
            });
            added++;
          }
        }
        state.importResult =
          "新增 " + added + " 条，跳过重复 " + (2 - added) + " 条，失败 1 条";
        state.importStep = 2;
        state.leadFilter = "all";
      }
      render();
      remember();
      if (action === "close-modal" && focusBeforeModal)
        root
          .querySelector('[data-action="' + focusBeforeModal.action + '"]')
          ?.focus();
    }
    // 更新原生控件的筛选、角色、任务状态与规则开关。
    function onChange(event) {
      const control = event.target;
      if (control.id === "yx-stage") {
        root.querySelector("#yx-loss-label").hidden = control.value !== "4";
        return;
      }
      if (control.id === "yx-role") {
        state.role = control.value;
        state.page = "deals";
        state.notice = "";
      } else if (control.dataset.filter)
        state[control.dataset.filter] = control.value;
      else if (control.dataset.task) {
        const task = find("tasks", control.dataset.task);
        const deal = task && find("deals", task.deal);
        if (!deal || !visible(deal)) return;
        task.done = control.checked;
        state.notice = task.done ? "任务已完成" : "任务已恢复为未完成";
      } else if (control.dataset.rule && state.role === "admin") {
        const rule = find("rules", control.dataset.rule);
        rule.enabled = control.checked;
        state.notice = "规则状态已更新";
      } else return;
      render();
      remember();
    }
    // 清除已修正输入的校验提示，保证空白提交后仍可继续填写。
    function onInput(event) {
      if (event.target.matches("input,textarea"))
        event.target.setCustomValidity("");
    }
    // 弹窗支持 Escape 关闭与 Tab 焦点循环。
    function onKeydown(event) {
      if (!state.modal) return;
      if (event.key === "Escape") {
        state.modal = null;
        render();
        if (focusBeforeModal)
          root
            .querySelector('[data-action="' + focusBeforeModal.action + '"]')
            ?.focus();
        return;
      }
      if (event.key === "Tab") {
        const controls = root.querySelectorAll(
          ".yx-modal input,.yx-modal select,.yx-modal button",
        );
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    }
    // 仅接受更新的宿主状态，防止旧快照覆盖刚完成的操作。
    function onGlobals(event) {
      const next = event.detail?.globals?.widgetState?.privateContent;
      if (
        next?.version === 1 &&
        next.revision > state.revision &&
        Array.isArray(next.deals)
      ) {
        state = { ...state, ...next };
        render();
      }
    }
    root.addEventListener("click", onClick);
    root.addEventListener("change", onChange);
    root.addEventListener("input", onInput);
    root.addEventListener("keydown", onKeydown);
    window.addEventListener("openai:set_globals", onGlobals);
    render();
  })();
</script>
