    function reportsPage() {

      let max = 1;
      for (const status of statuses) {
        counts[status] = 0;
        sums[status] = 0;
      }
      for (const item of state.contracts)
        if (visible(item)) {
          counts[item.status]++;
          sums[item.status] += item.amount;
          total += item.amount;
          max = Math.max(max, counts[item.status]);
        }
      for (const point of state.milestones)

          !point.done &&
          point.type === "付款" &&
          visible(contract(point.contract))

          '<div class="hc-bar-row"><span>' +
          status +

          (counts[status] / max) * 100 +
          '%"></div></div><span>' +
          counts[status] +
          "</span></div>";

          "<tr><td>" +
          status +
          "</td><td>" +
          counts[status] +

      if (action === "filter-status")
        state.statusFilter = target.dataset.status;

        const item = contract(target.dataset.id);
        if (!visible(item)) return;
        state.selected = item.id;
        state.page = "detail";
      }
      if (action === "back-contracts") state.page = "contracts";
      if (action === "new-contract") state.page = "create";
      if (action === "milestone-filter")
        state.milestoneFilter = target.dataset.value;
      if (action === "save-contract") {
        const name = field("hc-name");
        const vendor = field("hc-vendor");
        const amount = field("hc-amount");
        const start = field("hc-start");
        const end = field("hc-end");
        if (
          name === null ||
          vendor === null ||
          amount === null ||
          start === null ||
          end === null
        )
          return;
        const input = root.querySelector('[name="hc-end"]');
        input.setCustomValidity(end < start ? "到期日期不能早于起始日期" : "");
        if (!input.reportValidity()) return;
        const id = nextId();
        state.contracts.push({
          id,
          number: "HC-2026-" + String(id).padStart(3, "0"),
          name,
          vendor,
          amount: Number(amount),
          owner: "周宁",
          department: "采购部",
          status: "草稿",
          start,
          end,
          attachment: "",
          notes: "",
          remind: true,
          history: [],
        });
        state.selected = id;
        state.page = "detail";
        state.notice = "草稿已保存";
      }
      if (action === "submit-approval") {
        const item = contract();
        if (!visible(item) || item.status !== "草稿") return;
        item.status = "审批中";
        state.notice = "已提交内部审批";
      }
      if (action === "open-approval") {
        const item = contract(target.dataset.id);
        if (!canApprove(item)) return;
        state.selected = item.id;
        state.page = "approval-detail";
      }
      if (action === "back-approvals") state.page = "approvals";
      if (action === "approve" || action === "reject-approval") {
        const item = contract();
        if (!canApprove(item)) return;
        const input = root.querySelector("#hc-opinion");
        const opinion = input.value.trim();
        if (action === "reject-approval" && !opinion) {
          input.setCustomValidity("请填写退回原因");
          input.reportValidity();
          return;
        }
        item.history.push({
          date: "2026-11-12",
          by: roleNames[state.role],
          result: action === "approve" ? "通过" : "退回",
          comment: opinion,
        });
        item.status = action === "approve" ? "履约中" : "草稿";
        state.page = "detail";
        state.notice =
          action === "approve"
            ? "内部审批已通过，签署与生效需核实实际文件"
            : "已退回草稿，请经办人修改";
      }
      if (action === "save-notes") {
        const item = contract();
        if (!visible(item)) return;
        item.notes = root.querySelector("#hc-notes").value.trim();
        state.notice = "业务备注已保存";
      }
      if (action === "run-import") {
        let added = 0;
        for (const sample of [
          {
            number: "HC-IMPORT-001",
            name: "办公耗材年度采购",
            vendor: "佑禾商贸",
            amount: 24000,
          },
          {
            number: "HC-IMPORT-002",
            name: "基础设施维护服务",
            vendor: "景川服务",
            amount: 36000,
          },
        ]) {
          let duplicate = false;
          for (const item of state.contracts)
            if (item.number === sample.number) duplicate = true;
          if (!duplicate) {
            state.contracts.push({
              id: nextId(),
              ...sample,
              owner: "周宁",
              department: "采购部",
              status: "草稿",
              start: "2026-12-01",
              end: "2027-11-30",
              attachment: "",
              notes: "由示例导入。",
              remind: true,
              history: [],
            });
            added++;
          }
        }
        state.importStep = 1;
        state.importResult =
          "新增 " + added + " 份，重复跳过 " + (2 - added) + " 份，失败 1 份";
      }
      render();
      remember();
    }
    // 完成节点和提醒开关都修改原合同关联数据。
    function onChange(event) {
      const target = event.target;
      if (target.id === "hc-role") {
        state.role = target.value;
        state.page = "contracts";
        state.statusFilter = "all";
        state.notice = "";
      } else if (target.dataset.milestone) {
        let point = null;
        for (const item of state.milestones)
          if (item.id === Number(target.dataset.milestone)) point = item;
        const item = point && contract(point.contract);
        if (!visible(item) || item.status !== "履约中") return;
        point.done = target.checked;
        state.notice = point.done
          ? "节点已标记完成，报表同步更新"
          : "节点已恢复为未完成";
      } else if (target.dataset.remind) {
        const item = contract(target.dataset.remind);
        if (!visible(item)) return;
        item.remind = target.checked;
        state.notice = "站内提醒配置已更新";
      } else return;
      render();
      remember();
    }
    // 用户修改表单时清除上一次业务校验提示。
    function onInput(event) {
      if (event.target.matches("input,textarea"))
        event.target.setCustomValidity("");
    }
    // 仅接受较新的兼容宿主快照。
    function onGlobals(event) {
      const next = event.detail?.globals?.widgetState?.privateContent;
      if (
        next?.version === 1 &&
        next.revision > state.revision &&
        Array.isArray(next.contracts)
      ) {
        state = { ...state, ...next };
        render();
      }
    }
    root.addEventListener("click", onClick);
    root.addEventListener("change", onChange);
    root.addEventListener("input", onInput);
    window.addEventListener("openai:set_globals", onGlobals);
    render();
  })();
</script>
